<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Відновлення пароля — СЮСТР</title><style>.authpage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:#f8f2e5}.box{max-width:430px;width:100%;text-align:center}.box img{width:100px;height:100px;border-radius:50%;object-fit:cover}.box h1{text-align:left;font-size:30px}.box p{text-align:left;color:var(--muted);font-family:Arial,sans-serif}.wide{width:100%}</style></head><body><div class="authpage"><main class="box"><button class="icon" style="display:block" onclick="history.back()">←</button><img src="/logo.jpg"><h1>Відновлення пароля</h1><p>Введіть логін або номер телефону. Для безпечного автоматичного відновлення потрібно буде підключити SMS або email-сервіс.</p><input id="login" placeholder="Логін або номер телефону"><button class="wide" onclick="send()">Надіслати</button><p id="msg"></p></main></div><script>function send(){msg.textContent='Запит прийнято. Автоматичне SMS-відновлення буде доступне після підключення сервісу повідомлень.'}</script></body></html>

<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Вхід</title></head><body><form class="panel" onsubmit="login(event)"><img src="logo.jpg" style="width:130px;display:block;margin:auto;border-radius:50%"><h2>Вхід</h2><input id="u" placeholder="Логін" required><input id="p" type="password" placeholder="Пароль" required><button>Увійти</button><p>Немає акаунта? <a href="#" onclick="reg()">Зареєструватися</a></p><p id="msg"></p></form><script>async function login(e){e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let j=await r.json();if(r.ok)location.href=['admin','owner'].includes(j.role)?'/admin.html':'/';else msg.textContent=j.error}async function reg(){let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});let j=await r.json();if(r.ok)location.href='/';else msg.textContent=j.error}</script></body></html>

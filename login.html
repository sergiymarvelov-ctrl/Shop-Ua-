<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>СЮСТР — Акаунт</title><link rel="stylesheet" href="/style.css">
<style>
.auth{min-height:100vh;padding:24px 18px;background:#f8f2e5}.box{width:100%;max-width:430px;margin:auto}.logo2{display:block;width:105px;height:105px;border-radius:50%;object-fit:cover;margin:10px auto}.title{text-align:center}.auth-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.wide{width:100%;margin-top:9px}.hidden{display:none!important}.switch{text-align:center;margin-top:17px}.switch a{color:var(--gold)!important;font-weight:bold}.msg{text-align:center;color:#a33}
</style></head><body><div class="auth"><main class="box">
<img class="logo2" src="/logo.jpg"><h1 class="title">СЮСТР</h1>
<section id="signin" class="auth-card"><h2>Вхід в акаунт</h2><p class="muted">Введіть логін або номер телефону.</p>
<form id="lf"><input id="li" placeholder="Логін або номер телефону" required><input id="lp" type="password" placeholder="Пароль" required><button class="wide">Увійти</button><p id="lm" class="msg"></p></form>
<p class="switch">Немає акаунта? <a href="#" onclick="show('register');return false">Створити акаунт</a></p></section>
<section id="register" class="auth-card hidden"><h2>Створити акаунт</h2><p class="muted">Заповніть дані для реєстрації.</p>
<form id="rf"><input id="rn" placeholder="Ім’я" required><input id="rp" type="tel" placeholder="Номер телефону" required>
<input id="ru" placeholder="Логін" minlength="3" required><input id="r1" type="password" minlength="6" placeholder="Пароль" required>
<input id="r2" type="password" minlength="6" placeholder="Повторіть пароль" required><button class="wide">Зареєструватися</button><p id="rm" class="msg"></p></form>
<p class="switch">Вже є акаунт? <a href="#" onclick="show('login');return false">Увійти</a></p></section>
</main></div><script>
function show(x){signin.classList.toggle("hidden",x!=="login");register.classList.toggle("hidden",x!=="register")}
if(new URLSearchParams(location.search).get("mode")==="register")show("register");
lf.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:li.value,password:lp.value})});let j=await r.json();if(!r.ok)return lm.textContent=j.error||"Помилка входу";location="/profile.html"}
rf.onsubmit=async e=>{e.preventDefault();if(r1.value!==r2.value)return rm.textContent="Паролі не співпадають";let r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone:rp.value,username:ru.value,password:r1.value})});let j=await r.json();if(!r.ok)return rm.textContent=j.error||"Помилка реєстрації";await fetch("/api/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:rn.value})});location="/profile.html"}
</script></body></html>

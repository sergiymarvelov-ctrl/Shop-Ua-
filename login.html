<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>SYSTR — Вхід</title></head><body><main class="wrap"><section class="panel auth"><img src="/logo.jpg" style="width:120px;display:block;margin:auto;border-radius:50%"><h1>SYSTR</h1>
<div class="tabs"><button onclick="mode('login')" type="button">Увійти в наявний акаунт</button><button onclick="mode('register')" type="button" class="ghost">Зареєструватися</button></div>
<form id="form"><div id="phoneReg" class="hidden"><input id="phone" placeholder="Номер телефону" type="tel"></div><input id="login" placeholder="Логін або номер телефону" required><input id="password" type="password" minlength="6" placeholder="Пароль" required><button id="go">Увійти</button><p id="msg" class="msg"></p></form><a href="/">← Магазин</a></section></main>
<script>
let current="login";function mode(x){current=x;phoneReg.classList.toggle("hidden",x==="login");login.placeholder=x==="login"?"Логін або номер телефону":"Логін";go.textContent=x==="login"?"Увійти":"Зареєструватися";msg.textContent=""}
form.onsubmit=async e=>{e.preventDefault();const body=current==="login"?{login:login.value,password:password.value}:{phone:phone.value,username:login.value,password:password.value};const r=await fetch(current==="login"?"/api/login":"/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)return msg.textContent=j.error||"Помилка";const next=new URLSearchParams(location.search).get("next");location=next||"/profile.html"}
</script></body></html>

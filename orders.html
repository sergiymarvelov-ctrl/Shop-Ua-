<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Мої замовлення</title></head><body><header class="top"><b onclick="history.back()">← Мої замовлення</b></header><main class="page"><div class="tabs"><button>Всі</button><button class="outline">В обробці</button><button class="outline">Доставлені</button></div><div id="orders"></div></main><nav class="bottom"><a href="/"><b>⌂</b>Головна</a><a href="/catalog.html"><b>☷</b>Каталог</a><a href="/favorites.html"><b>♡</b>Обране</a><a href="/cart.html"><b>🛒</b>Кошик</a><a href="/profile.html"><b>♙</b>Профіль</a></nav><script>async function load(){let r=await fetch('/api/my-orders');if(r.status===401)return location='/login.html';let a=await r.json();orders.innerHTML=a.length?a.map(o=>`<div class="panel"><div class="row between"><b>№${o.id}</b><span>${o.status}</span></div><p class="muted">${new Date(o.created).toLocaleDateString('uk-UA')}</p><p>${o.items.map(i=>i.name).join(', ')}</p><b>${o.total} грн</b></div>`).join(''):'<div class="panel">Замовлень поки немає.</div>'}load()</script></body></html>

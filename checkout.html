<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>SYSTR — Замовлення</title></head><body>
<header><div class="brand"><img src="/logo.jpg"><span>Оформлення замовлення</span></div><nav><a class="button" href="/">Назад</a></nav></header><main class="wrap"><form class="panel" id="form">
<h2>Дані покупця</h2><div class="two"><input id="firstName" placeholder="Ім’я" required><input id="lastName" placeholder="Прізвище" required></div><input id="phone" type="tel" placeholder="Номер телефону" required>
<h2>Доставка</h2><select id="delivery" onchange="deliveryChange()"><option value="pickup">Самовивіз</option><option value="nova">Нова пошта</option></select>
<div id="pickupBox" class="panel"><b id="pickupText"></b><p id="contactText"></p></div><div id="novaBox" class="hidden"><input id="city" placeholder="Місто / село"><input id="branch" placeholder="Номер або назва відділення Нової пошти"></div>
<h2>Промокод</h2><input id="promo" placeholder="Промокод (необов’язково)"><button>Замовити</button><p id="msg"></p></form></main>
<script>
let cart=JSON.parse(localStorage.getItem("systrCart")||"[]");
async function init(){const m=await(await fetch("/api/me")).json();if(!m){location="/login.html?next=checkout.html";return}phone.value=m.phone||"";const s=await(await fetch("/api/settings")).json();pickupText.textContent=s.pickupText;contactText.textContent=s.contactText}
function deliveryChange(){const n=delivery.value==="nova";novaBox.classList.toggle("hidden",!n);pickupBox.classList.toggle("hidden",n)}
form.onsubmit=async e=>{e.preventDefault();const body={items:cart,firstName:firstName.value,lastName:lastName.value,phone:phone.value,delivery:delivery.value,city:city.value,branch:branch.value,promo:promo.value};const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)return msg.textContent=j.error||"Помилка";localStorage.removeItem("systrCart");document.querySelector("main").innerHTML='<section class="panel" style="text-align:center"><h1>Дякуємо за покупку! ❤️</h1><p>Замовлення передано адміністратору.</p><a class="button" href="/profile.html">Мої замовлення</a></section>'};} 
init();deliveryChange();
</script></body></html>

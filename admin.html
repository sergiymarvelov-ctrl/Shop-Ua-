<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Адмін-панель</title></head><body><header><div class=brand><img src=logo.jpg><span>Адмін-панель</span></div><nav><a href="/">Магазин</a><button onclick="logout()">Вийти</button></nav></header><main class=wrap><h1>Керування магазином</h1><p id=who></p><div class=admin-grid><form class=panel action="/api/products" method=post enctype="multipart/form-data"><h2>Додати товар</h2><input name=name placeholder="Назва" required><input name=price type=number placeholder="Ціна ₴" required><textarea name=desc placeholder="Опис"></textarea><input name=image type=file accept="image/*"><button>Додати</button></form><form class=panel onsubmit="addAdmin(event)"><h2>Додати адміністратора</h2><input id=au placeholder="Логін" required><input id=ap type=password placeholder="Пароль" required><button>Створити адміністратора</button><p id=amsg></p></form></div><h2>Товари</h2><div id=plist></div><h2>Замовлення</h2><div id=orders></div></main><script>async function init(){let m=await(await fetch('/api/me')).json();if(!m||!['admin','owner'].includes(m.role)){location='/login.html';return}who.textContent=`Ви увійшли як ${m.username} (${m.role==='owner'?'Головний адміністратор':'Адміністратор'})`;let ps=await(await fetch('/api/products')).json();plist.innerHTML=ps.map(p=>`<div class=card><form action="/api/products/${p.id}" method=post enctype="multipart/form-data"><input name=name value="${p.name}"><input name=price type=number value="${p.price}"><textarea name=desc>${p.desc}</textarea><input name=image type=file accept="image/*"><button>Зберегти</button> <button type=button onclick="del(${p.id})">Видалити</button></form></div>`).join('');let os=await(await fetch('/api/orders')).json();orders.innerHTML=os.length?`<table><tr><th>ID</th><th>Клієнт</th><th>Телефон</th><th>Статус</th></tr>${os.map(o=>`<tr><td>${o.id}</td><td>${o.name||''}</td><td>${o.phone||''}</td><td>${o.status}</td></tr>`).join('')}</table>`:'Замовлень поки немає'}async function del(id){await fetch('/api/products/'+id,{method:'DELETE'});location.reload()}async function addAdmin(e){e.preventDefault();let r=await fetch('/api/admins',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:au.value,password:ap.value})});let j=await r.json();amsg.textContent=r.ok?'Адміністратора створено':j.error}async function logout(){await fetch('/api/logout',{method:'POST'});location='/'}init()</script></body></html>

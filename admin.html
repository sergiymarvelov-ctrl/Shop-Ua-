<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>СЮСТР — Адмін-панель</title><link rel="stylesheet" href="/style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f2e5;color:var(--ink,#342719)}
.wrap{max-width:700px;margin:auto;padding:16px 16px 90px}.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.head img{width:54px;height:54px;border-radius:50%}.card{background:var(--card,#fffaf0);border:1px solid var(--line,#e3d7c1);border-radius:18px;padding:17px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{text-align:center;padding:15px}.stat b{display:block;font-size:25px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.tabs button{white-space:nowrap}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border:1px solid #d8cbb3;border-radius:10px;background:white;font:inherit}
button,.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--gold,#b48a32);color:white;font-weight:700;text-decoration:none;display:inline-block}
.secondary{background:transparent;color:var(--ink,#342719);border:1px solid #c8ad72}.danger{background:#9c4c43}.item{padding:13px 0;border-bottom:1px solid var(--line,#e3d7c1)}.item:last-child{border:0}
.item img{width:65px;height:65px;object-fit:cover;border-radius:10px;float:right;margin-left:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.hidden{display:none}.msg{min-height:20px}.back{color:var(--ink,#342719);text-decoration:none}
</style></head>
<body><main class="wrap">
<div class="head"><img src="/logo.jpg"><div><h1 style="margin:0">Адмін-панель</h1><span id="who">СЮСТР</span></div></div>
<a class="back" href="/profile.html">← Повернутися в профіль</a>
<div id="denied" class="card hidden"><h2>Немає доступу</h2><p>Увійдіть під акаунтом власника або адміністратора.</p></div>
<div id="panel" class="hidden">
<section class="grid">
<div class="card stat"><b id="sUsers">0</b>Користувачів</div><div class="card stat"><b id="sProducts">0</b>Товарів</div>
<div class="card stat"><b id="sOrders">0</b>Замовлень</div><div class="card stat"><b id="sPromos">0</b>Промокодів</div>
</section>
<div class="tabs">
<button onclick="tab('products')">🧼 Товари</button><button onclick="tab('orders')">📦 Замовлення</button>
<button onclick="tab('users')">👥 Користувачі</button><button onclick="tab('promos')">🎟 Промокоди</button>
<button onclick="tab('settings')">⚙️ Налаштування</button>
</div>

<section id="products" class="card pane"><h2>Товари</h2>
<h3>Додати товар</h3><form id="productForm">
<input name="name" placeholder="Назва товару" required><input name="price" type="number" min="0" step="0.01" placeholder="Ціна, грн" required>
<textarea name="desc" placeholder="Опис"></textarea><label>Фото товару</label><input name="image" type="file" accept="image/*">
<button type="submit">+ Додати товар</button><p id="productMsg" class="msg"></p></form><div id="productList"></div></section>

<section id="orders" class="card pane hidden"><h2>Замовлення</h2><div id="orderList"></div></section>
<section id="users" class="card pane hidden"><h2>Користувачі</h2><div id="userList"></div></section>

<section id="promos" class="card pane hidden"><h2>Промокоди</h2>
<form id="promoForm"><input name="code" placeholder="Наприклад SYSTR10" required><input name="discount" type="number" min="0" max="100" placeholder="Знижка, %">
<button type="submit">Створити промокод</button><p id="promoMsg"></p></form><div id="promoList"></div></section>

<section id="settings" class="card pane hidden"><h2>Налаштування магазину</h2>
<form id="settingsForm"><input name="shopName" placeholder="Назва магазину"><input name="subtitle" placeholder="Підзаголовок">
<textarea name="pickupText" placeholder="Самовивіз"></textarea><textarea name="contactText" placeholder="Контактна інформація"></textarea>
<button type="submit">Зберегти</button><p id="settingsMsg"></p></form></section>
</div></main>
<script>
const $=x=>document.getElementById(x), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opt={}){let r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||("Помилка "+r.status));return d}
function tab(id){document.querySelectorAll(".pane").forEach(x=>x.classList.add("hidden"));$(id).classList.remove("hidden")}
async function init(){try{let me=await api("/api/me");if(!me||!["owner","admin"].includes(me.role))throw Error("denied");who.textContent=me.name||me.username;panel.classList.remove("hidden");await Promise.all([stats(),products(),orders(),users(),promos(),settings()])}catch(e){denied.classList.remove("hidden")}}
async function stats(){let s=await api("/api/admin/stats");sUsers.textContent=s.users;sProducts.textContent=s.products;sOrders.textContent=s.orders;sPromos.textContent=s.promos}
async function products(){let a=await api("/api/products");productList.innerHTML=a.map(p=>`<div class="item">${p.image?`<img src="${p.image}">`:""}<b>${esc(p.name)}</b><div>${Number(p.price||0)} грн</div><small>${esc(p.desc||"")}</small><div class="actions"><button class="secondary" onclick="editProduct('${p.id}')">Редагувати</button><button class="danger" onclick="delProduct('${p.id}')">Видалити</button></div></div>`).join("")||"<p>Товарів поки немає.</p>"}
productForm.onsubmit=async e=>{e.preventDefault();productMsg.textContent="Додаємо…";try{await api("/api/admin/products",{method:"POST",body:new FormData(productForm)});productForm.reset();productMsg.textContent="Товар додано ✓";await products();await stats()}catch(x){productMsg.textContent=x.message}}
async function editProduct(id){let a=await api("/api/products"),p=a.find(x=>String(x.id)===String(id));if(!p)return;let name=prompt("Назва товару:",p.name);if(name===null)return;let price=prompt("Ціна:",p.price);if(price===null)return;let desc=prompt("Опис:",p.desc||"");if(desc===null)return;let f=new FormData();f.append("name",name);f.append("price",price);f.append("desc",desc);try{await api("/api/admin/products/"+id,{method:"PATCH",body:f});await products()}catch(e){alert(e.message)}}
async function delProduct(id){if(!confirm("Видалити цей товар?"))return;try{await api("/api/admin/products/"+id,{method:"DELETE"});await products();await stats()}catch(e){alert(e.message)}}
async function orders(){let a=await api("/api/admin/orders");orderList.innerHTML=a.map(o=>`<div class="item"><b>Замовлення #${o.id}</b><div>${esc(o.name||o.username)} · ${Number(o.total||0)} грн</div><small>${esc(o.phone||"")}</small><div class="actions"><select id="st${o.id}"><option>${esc(o.status||"Нове")}</option><option>Нове</option><option>В обробці</option><option>Відправлено</option><option>Виконано</option><option>Скасовано</option></select><button onclick="statusOrder('${o.id}')">Зберегти статус</button><button class="danger" onclick="delOrder('${o.id}')">Видалити</button></div></div>`).join("")||"<p>Замовлень немає.</p>"}
async function statusOrder(id){try{await api("/api/admin/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:$("st"+id).value})});await orders()}catch(e){alert(e.message)}}
async function delOrder(id){if(!confirm("Видалити замовлення?"))return;try{await api("/api/admin/orders/"+id,{method:"DELETE"});await orders();await stats()}catch(e){alert(e.message)}}
async function users(){let a=await api("/api/admin/users");userList.innerHTML=a.map(u=>`<div class="item"><b>${esc(u.name||u.username)}</b><div>@${esc(u.username)} · ${esc(u.role)}</div>${u.role!=="owner"?`<div class="actions"><button class="secondary" onclick="role('${u.id}','${u.role==="admin"?"user":"admin"}')">${u.role==="admin"?"Зняти адміна":"Зробити адміном"}</button></div>`:"<small>Власник магазину</small>"}</div>`).join("")}
async function role(id,role){try{await api("/api/admin/users/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({role})});await users()}catch(e){alert(e.message)}}
async function promos(){let a=await api("/api/admin/promos");promoList.innerHTML=a.map(p=>`<div class="item"><b>${esc(p.code)}</b> — ${Number(p.discount||0)}% <button class="danger" onclick="delPromo('${p.id}')">Видалити</button></div>`).join("")||"<p>Промокодів немає.</p>"}
promoForm.onsubmit=async e=>{e.preventDefault();let f=new FormData(promoForm);try{await api("/api/admin/promos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(f))});promoForm.reset();promoMsg.textContent="Створено ✓";await promos();await stats()}catch(x){promoMsg.textContent=x.message}}
async function delPromo(id){try{await api("/api/admin/promos/"+id,{method:"DELETE"});await promos();await stats()}catch(e){alert(e.message)}}
async function settings(){let s=await api("/api/settings");for(let k of ["shopName","subtitle","pickupText","contactText"])if(settingsForm.elements[k])settingsForm.elements[k].value=s[k]||""}
settingsForm.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(settingsForm));try{await api("/api/admin/settings",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});settingsMsg.textContent="Збережено ✓"}catch(x){settingsMsg.textContent=x.message}}
init();
</script></body></html>

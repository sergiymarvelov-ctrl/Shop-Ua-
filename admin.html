<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>SYSTR — Адмін</title></head><body>
<header><div class="brand"><img src="/logo.jpg"><span>SYSTR · Адмін-панель</span></div><nav><a class="button" href="/">Магазин</a><button onclick="logout()">Вийти</button></nav></header><main class="wrap"><p id="who"></p>
<div class="two"><form class="panel" action="/api/products" method="post" enctype="multipart/form-data"><h2>Додати товар</h2><input name="name" placeholder="Назва" required><input name="price" type="number" min="0" placeholder="Ціна" required><textarea name="desc" placeholder="Опис"></textarea><input name="image" type="file" accept="image/*"><button>Додати товар</button></form>
<form class="panel" id="promoForm"><h2>Створити промокод</h2><input id="pc" placeholder="Промокод" required><input id="pd" placeholder="Опис промокоду"><input id="discount" type="number" min="0" max="100" placeholder="Знижка %"><button>Створити</button><p id="pmsg"></p></form></div>
<form class="panel" id="settingsForm"><h2>Налаштування магазину</h2><label>Фон сайту</label><input id="background" type="color"><input id="subtitle" placeholder="Підзаголовок"><textarea id="pickupText" placeholder="Текст самовивозу"></textarea><textarea id="contactText" placeholder="Як зв’язатися для самовивозу"></textarea><button>Зберегти для всіх</button><p id="smsg"></p></form>
<form class="panel hidden" id="adminForm"><h2>Додати адміністратора</h2><input id="au" placeholder="Логін"><input id="ap" type="password" minlength="6" placeholder="Пароль"><button>Створити адміна</button><p id="amsg"></p></form>
<h2>Замовлення</h2><div id="orders"></div><h2>Товари</h2><div id="products"></div></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const m=await(await fetch("/api/me")).json();if(!m||!["admin","owner"].includes(m.role)){location="/login.html";return}who.textContent=`${m.username} · ${m.role==="owner"?"Головний адміністратор":"Адміністратор"}`;if(m.role==="owner")adminForm.classList.remove("hidden");const s=await(await fetch("/api/settings")).json();background.value=/^#[0-9a-f]{6}$/i.test(s.background)?s.background:"#faf7ef";subtitle.value=s.subtitle||"";pickupText.value=s.pickupText||"";contactText.value=s.contactText||"";loadOrders();loadProducts()}
promoForm.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/promos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:pc.value,description:pd.value,discount:discount.value})});const j=await r.json();pmsg.textContent=r.ok?"Промокод створено ✓":j.error}
settingsForm.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/settings",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({background:background.value,subtitle:subtitle.value,pickupText:pickupText.value,contactText:contactText.value})});smsg.textContent=r.ok?"Збережено ✓":"Помилка"}
adminForm.onsubmit=async e=>{e.preventDefault();const r=await fetch("/api/admins",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:au.value,password:ap.value})});const j=await r.json();amsg.textContent=r.ok?"Адміна створено ✓":j.error}
async function loadOrders(){const a=await(await fetch("/api/orders")).json();orders.innerHTML=a.length?a.map(o=>`<div class="card order"><b>#${o.id} · ${esc(o.firstName)} ${esc(o.lastName)}</b><p>${esc(o.phone)}</p><p>${o.items.map(i=>`${esc(i.name)} — ${i.price} ₴`).join("<br>")}</p><p>Доставка: ${o.delivery==="pickup"?"Самовивіз":`Нова пошта · ${esc(o.city)} · ${esc(o.branch)}`}</p><p>Промокод: ${esc(o.promo||"—")} · Разом: <b>${o.total} ₴</b></p><select onchange="statusChange('${o.id}',this.value)">${["Нове","Підтверджено","Відправлено","Виконано","Скасовано"].map(x=>`<option ${o.status===x?"selected":""}>${x}</option>`).join("")}</select></div>`).join(""):"Замовлень немає"}
async function statusChange(id,status){await fetch("/api/orders/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})})}
async function loadProducts(){const a=await(await fetch("/api/products")).json();products.innerHTML=a.map(p=>`<form class="card" action="/api/products/${p.id}" method="post" enctype="multipart/form-data"><input name="name" value="${esc(p.name)}"><input name="price" type="number" value="${p.price}"><textarea name="desc">${esc(p.desc)}</textarea><input name="image" type="file" accept="image/*"><button>Зберегти</button> <button type="button" onclick="del('${p.id}')">Видалити</button></form>`).join("")}
async function del(id){if(confirm("Видалити товар?")){await fetch("/api/products/"+id,{method:"DELETE"});loadProducts()}}
async function logout(){await fetch("/api/logout",{method:"POST"});location="/"}init();
</script></body></html>

<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>СЮСТР</title></head><body><header class="top"><div class="logo"><img src="/logo.jpg"><span>СЮСТР<br><small class="muted">Натуральне мило</small></span></div><div><button class="icon" onclick="location='/catalog.html'">⌕</button><button class="icon" onclick="location='/cart.html'">🛒</button></div></header><main class="page"><input class="search" placeholder="Пошук товарів..." onfocus="location='/catalog.html'"><section class="hero"><div><h1>Натуральне мило ручної роботи</h1><p>З любов’ю до природи і вашої шкіри</p><button onclick="location='/catalog.html'">Переглянути каталог →</button></div></section><div class="section-title"><h2>Популярні товари</h2><a href="/catalog.html">Усі →</a></div><div id="products" class="grid"></div><section class="panel"><h2>СЮСТР — натуральна турбота</h2><p>Мило ручної роботи для щоденного догляду та подарунків.</p><button onclick="location='/about.html'">Про нас</button> <button class="outline" onclick="location='/faq.html'">FAQ</button></section></main><nav class="bottom"><a href="/"><b>⌂</b>Головна</a><a href="/catalog.html"><b>☷</b>Каталог</a><a href="/favorites.html"><b>♡</b>Обране</a><a href="/cart.html"><b>🛒</b>Кошик</a><a href="/profile.html"><b>♙</b>Профіль</a></nav><script>
async function load(){let a=await(await fetch('/api/products')).json();products.innerHTML=a.slice(0,6).map(p=>`<article class="card"><button class="heart" onclick="fav('${p.id}')">♡</button><img onclick="location='/product.html?id=${p.id}'" src="${p.image||'/logo.jpg'}"><h3>${p.name}</h3><b class="price">${p.price} грн</b><button class="add" onclick="add('${p.id}')">+</button></article>`).join('')}function add(id){let c=JSON.parse(localStorage.getItem('systrCart')||'[]');c.push(id);localStorage.setItem('systrCart',JSON.stringify(c));alert('Додано в кошик')}function fav(id){let f=JSON.parse(localStorage.getItem('systrFav')||'[]');f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.setItem('systrFav',JSON.stringify(f))}load()</script></body></html>

<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СЮТСЯ — натуральне мило</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><img src="logo.jpg"><span>Майстерня натурального мила</span></div><nav><a href="login.html">Вхід</a> <a href="admin.html">Адмін</a></nav></header><section class="hero"><div><h1>Натуральне мило ручної роботи</h1><p>Каталог авторського мила, створеного з турботою. Обирай аромат, додавай у кошик та оформлюй замовлення.</p><a class="btn" href="#catalog">Переглянути каталог</a></div><img src="logo.jpg"></section><main class="wrap"><h2 id="catalog">Каталог</h2><div id="products" class="grid"></div><section class="modal"><h2>Кошик</h2><div id="cart"></div><input id="name" placeholder="Ваше ім'я"><input id="phone" placeholder="Телефон"><button onclick="order()">Оформити замовлення</button></section></main><script>let cart=[];async function load(){let ps=await(await fetch('/api/products')).json();products.innerHTML=ps.map(p=>`<article class=card><img class=product-img src="${p.image||'logo.jpg'}"><h3>${p.name}</h3><p>${p.desc}</p><div class=price>${p.price} ₴</div><button onclick='add(${JSON.stringify(p)})'>У кошик</button></article>`).join('')}function add(p){cart.push(p);draw()}function draw(){document.querySelector('#cart').innerHTML=cart.length?cart.map((p,i)=>`<p>${p.name} — ${p.price} ₴ <button onclick="cart.splice(${i},1);draw()">×</button></p>`).join('')+`<b>Разом: ${cart.reduce((s,p)=>s+p.price,0)} ₴</b>`:'Кошик порожній'}async function order(){let r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:cart.map(x=>x.id),name:name.value,phone:phone.value})});if(r.ok){alert('Замовлення прийнято!');cart=[];draw()}else alert((await r.json()).error)}load();draw()</script></body></html>

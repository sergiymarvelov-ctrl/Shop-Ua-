<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>SYSTR — Профіль</title></head><body>
<header><div class="brand"><img src="/logo.jpg"><span>Мій профіль</span></div><nav><a class="button" href="/">Магазин</a><button onclick="logout()">Вийти</button></nav></header><main class="wrap">
<div class="two"><section class="panel"><h2>Профіль</h2><p id="username"></p><label>Ім’я</label><input id="name"><label>Тема</label><select id="theme"><option value="light">Світла</option><option value="dark">Темна</option></select><button onclick="saveProfile()">Зберегти</button><p id="pmsg"></p></section>
<section class="panel"><h2>Промокод</h2><input id="promo" placeholder="Введіть промокод"><button onclick="usePromo()">Використати</button><p id="promsg"></p></section></div>
<section class="panel"><h2>Нагороди</h2><div id="rewards"></div></section><section class="panel"><h2>Мої замовлення / історія</h2><div id="orders"></div></section></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const m=await(await fetch("/api/me")).json();if(!m){location="/login.html";return}username.textContent="Логін: "+m.username;name.value=m.name||m.username;theme.value=m.theme||"light";if(m.theme==="dark")document.body.classList.add("dark");await loadRewards();await loadOrders()}
async function saveProfile(){const r=await fetch("/api/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name.value,theme:theme.value})});pmsg.textContent=r.ok?"Збережено ✓":"Помилка";if(r.ok)location.reload()}
async function usePromo(){const r=await fetch("/api/promo/use",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:promo.value})});const j=await r.json();promsg.textContent=r.ok?`Промокод активовано: ${j.promo.description}${j.promo.discount?` (-${j.promo.discount}%)`:""}`:j.error;await loadRewards()}
async function loadRewards(){const a=await(await fetch("/api/rewards")).json();rewards.innerHTML=a.map(x=>`<div class="reward"><span>${esc(x.title)}</span><span class="${x.done?"received":"locked"}">${x.done?"Отримано ✓":"Не отримано"}</span></div>`).join("")}
async function loadOrders(){const a=await(await fetch("/api/my-orders")).json();orders.innerHTML=a.length?a.map(o=>`<div class="card order"><b>Замовлення #${o.id}</b><p>${new Date(o.created).toLocaleString("uk-UA")}</p><p>${o.items.map(i=>esc(i.name)).join(", ")}</p><p><b>${o.total} ₴</b> · ${esc(o.status)}</p></div>`).join(""):"Замовлень поки немає"}
async function logout(){await fetch("/api/logout",{method:"POST"});location="/"}init();
</script></body></html>

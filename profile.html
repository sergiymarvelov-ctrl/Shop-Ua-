<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>СЮСТР — Профіль</title>
<link rel="stylesheet" href="/style.css">
<style>
/* Профіль незалежно від старих стилів */
.profile-page{width:100%;max-width:520px;margin:0 auto;padding:16px 16px 100px}
.profile-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.profile-brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.profile-brand img{width:46px!important;height:46px!important;object-fit:cover!important;border-radius:50%!important}
.profile-card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.profile-user{display:flex;align-items:center;gap:13px}
.profile-avatar{width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:#eee2c8;display:grid;place-items:center;font-size:28px}
.profile-user h2{margin:0 0 3px;font-size:22px}
.profile-menu a{display:flex!important;align-items:center!important;justify-content:space-between!important;width:100%!important;min-height:52px!important;padding:13px 2px!important;border-bottom:1px solid var(--line)!important;color:var(--ink)!important;text-decoration:none!important;font-size:16px!important}
.profile-menu a:last-child{border-bottom:0!important}
.profile-page input,.profile-page select{width:100%!important;font-size:16px!important;padding:13px!important}
.profile-page button{font-size:16px!important}
.profile-wide{width:100%;margin-top:8px}
.profile-reward{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.profile-reward .ok{color:#27844a;font-weight:700}
.profile-order{padding:12px 0;border-bottom:1px solid var(--line)}
@media(max-width:600px){
  .profile-page{max-width:none!important;width:100%!important}
  .profile-card{font-size:16px!important}
}
</style>
</head>
<body>

<header class="profile-top">
  <div class="profile-brand">
    <img src="/logo.jpg" alt="СЮСТР">
    <span>Мій профіль</span>
  </div>
  <button class="icon" onclick="location='/settings.html'">⚙</button>
</header>

<main class="profile-page">

<section class="profile-card">
  <div class="profile-user">
    <div class="profile-avatar">♙</div>
    <div>
      <h2 id="displayName">Профіль</h2>
      <div id="username" class="muted"></div>
    </div>
  </div>
</section>

<section class="profile-card">
  <h2>Особисті дані</h2>
  <label>Ім’я</label>
  <input id="name" placeholder="Ваше ім’я">

  <label>Тема</label>
  <select id="theme">
    <option value="light">Світла</option>
    <option value="dark">Темна</option>
  </select>

  <button class="profile-wide" onclick="saveProfile()">Зберегти</button>
  <p id="pmsg"></p>
</section>

<section class="profile-card">
  <h2>Швидке меню</h2>
  <div class="profile-menu">
    <a href="/orders.html"><span>▣ Мої замовлення</span><b>›</b></a>
    <a href="/favorites.html"><span>♡ Обране</span><b>›</b></a>
    <a href="/cart.html"><span>🛒 Кошик</span><b>›</b></a>
    <a href="/settings.html"><span>⚙ Налаштування</span><b>›</b></a>
    <a href="/faq.html"><span>ⓘ FAQ</span><b>›</b></a>
  </div>
</section>

<section class="profile-card">
  <h2>Промокод</h2>
  <input id="promo" placeholder="Введіть промокод">
  <button class="profile-wide" onclick="usePromo()">Використати</button>
  <p id="promsg"></p>
</section>

<section class="profile-card">
  <h2>Нагороди</h2>
  <div id="rewards"></div>
</section>

<section class="profile-card">
  <h2>Останні замовлення</h2>
  <div id="orders"></div>
  <button class="outline profile-wide" onclick="location='/orders.html'">Переглянути всі</button>
</section>

<button class="outline profile-wide" onclick="logout()">Вийти з акаунта</button>

</main>

<nav class="bottom">
<a href="/"><b>⌂</b>Головна</a>
<a href="/catalog.html"><b>☷</b>Каталог</a>
<a href="/favorites.html"><b>♡</b>Обране</a>
<a href="/cart.html"><b>🛒</b>Кошик</a>
<a href="/profile.html"><b>♙</b>Профіль</a>
</nav>

<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

async function init(){
  const r=await fetch("/api/me");
  const m=await r.json();

  if(!m){
    document.querySelector(".profile-page").innerHTML=`
      <section class="profile-card" style="text-align:center;margin-top:18px">
        <div class="profile-avatar" style="margin:0 auto 14px">♙</div>
        <h2 style="font-size:28px;margin-bottom:8px">Мій профіль</h2>
        <p class="muted">Увійдіть в акаунт, щоб бачити замовлення, обране, нагороди та промокоди.</p>
        <button class="profile-wide" onclick="location='/login.html'">Увійти</button>
        <button class="outline profile-wide" onclick="location='/login.html'">Створити акаунт</button>
      </section>
    `;
    return;
  }

  displayName.textContent=m.name||m.username;
  username.textContent="@"+m.username;
  name.value=m.name||m.username;
  theme.value=m.theme||"light";

  if(m.theme==="dark"){
    document.body.classList.add("dark");
  }

  await loadRewards();
  await loadOrders();
}

async function saveProfile(){
  const r=await fetch("/api/profile",{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      name:name.value,
      theme:theme.value
    })
  });

  pmsg.textContent=r.ok?"Збережено ✓":"Помилка";

  if(r.ok){
    setTimeout(()=>location.reload(),400);
  }
}

async function usePromo(){
  const r=await fetch("/api/promo/use",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:promo.value})
  });

  const j=await r.json();

  promsg.textContent=r.ok
    ?"Промокод активовано ✓"
    :(j.error||"Помилка");

  if(r.ok) await loadRewards();
}

async function loadRewards(){
  const r=await fetch("/api/rewards");
  if(!r.ok)return;

  const a=await r.json();

  rewards.innerHTML=a.map(x=>`
    <div class="profile-reward">
      <span>${esc(x.title)}</span>
      <span class="${x.done?"ok":""}">
        ${x.done?"Отримано ✓":"Не отримано"}
      </span>
    </div>
  `).join("");
}

async function loadOrders(){
  const r=await fetch("/api/my-orders");
  if(!r.ok)return;

  const a=await r.json();

  orders.innerHTML=a.length
    ?a.slice(0,3).map(o=>`
      <div class="profile-order">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <b>№${o.id}</b>
          <span>${esc(o.status)}</span>
        </div>
        <p class="muted">${new Date(o.created).toLocaleDateString("uk-UA")}</p>
        <b>${o.total} грн</b>
      </div>
    `).join("")
    :'<p class="muted">Замовлень поки немає.</p>';
}

async function logout(){
  await fetch("/api/logout",{method:"POST"});
  location="/";
}

init();
</script>

</body>
</html>

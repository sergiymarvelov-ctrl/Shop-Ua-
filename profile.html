<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>СЮСТР — Профіль</title><link rel="stylesheet" href="/style.css">
<style>*{box-sizing:border-box}.wrap{max-width:520px;margin:auto;padding:16px 16px 100px}.card{background:var(--card,#fffaf0);border:1px solid var(--line,#e4d8c1);border-radius:20px;padding:20px;margin:12px 0}.center{text-align:center}.ava{width:88px;height:88px;aspect-ratio:1/1;border-radius:50%;object-fit:cover;background:#eee1c5;border:2px solid #d8c59e;display:block;margin:0 auto}.badge{height:22px;width:22px;object-fit:contain;vertical-align:-5px;margin-left:6px;border-radius:0}.btn{display:block;width:100%;padding:13px;margin-top:9px;border:0;border-radius:11px;background:var(--gold,#b58a32);color:#fff!important;font-weight:700;text-decoration:none}.outline{background:transparent;color:var(--ink,#342719)!important;border:1px solid #c9ad72}.hidden{display:none}.menu a{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line,#e4d8c1);color:var(--ink,#342719)!important;text-decoration:none}</style></head>
<body><header class="top"><div class="logo"><img src="/logo.jpg"><span>Мій профіль</span></div></header>
<main class="wrap">
<a href="/" style="display:flex;align-items:center;gap:8px;color:var(--ink,#342719);text-decoration:none;font-weight:700;font-size:17px;margin:4px 0 12px">← На головну</a>
<div id="loading" class="card center">Завантаження…</div>
<section id="guest" class="card center hidden"><h1>Мій профіль</h1><p>Увійдіть або створіть акаунт.</p><a class="btn" href="/login.html?mode=login">Увійти</a><a class="btn outline" href="/login.html?mode=register">Створити акаунт</a></section>
<div id="account" class="hidden">
<section class="card center"><img id="avatar" class="ava" src="/logo.jpg"><h2><span id="name"></span><img id="badge" class="badge hidden"></h2><div id="username"></div>
<input id="avatarFile" type="file" accept="image/*" style="margin-top:12px"><button class="btn" onclick="changeAvatar()">Змінити аватарку</button><p id="avatarMsg"></p>
<a id="adminLink" class="btn outline hidden" href="/admin.html">Адмін-панель</a></section>
<section class="card menu"><a href="/orders.html"><span>Мої замовлення</span><b>›</b></a><a href="/favorites.html"><span>Обране</span><b>›</b></a><a href="/cart.html"><span>Кошик</span><b>›</b></a></section>
<button class="btn outline" onclick="logout()">Вийти з акаунта</button></div></main>
<script>
const $=x=>document.getElementById(x);let ME=null;
function badgeSrc(b){return b==="check"?"/badge-check.png":b==="admin"?"/badge-admin.jpg":""}
async function init(){try{let r=await fetch("/api/me",{cache:"no-store"}),m=await r.json();loading.classList.add("hidden");if(!m){guest.classList.remove("hidden");return}ME=m;account.classList.remove("hidden");avatar.src=m.avatar||"/logo.jpg";name.textContent=m.name||m.username;username.textContent="@"+m.username;if(m.badge){badge.src=badgeSrc(m.badge);badge.classList.remove("hidden")}if(["owner","admin"].includes(m.role))adminLink.classList.remove("hidden")}catch(e){loading.textContent="Не вдалося завантажити профіль"}}
async function changeAvatar(){let f=avatarFile.files[0];if(!f){avatarMsg.textContent="Спочатку виберіть фото";return}let d=new FormData();d.append("avatar",f);avatarMsg.textContent="Завантаження…";let r=await fetch("/api/profile/avatar",{method:"POST",body:d}),j=await r.json().catch(()=>({}));if(!r.ok){avatarMsg.textContent=j.error||"Помилка";return}avatar.src=j.avatar;avatarMsg.textContent="Аватарку змінено ✓"}
async function logout(){await fetch("/api/logout",{method:"POST"});location="/profile.html"}init();
</script>
<nav class="bottom">
<a href="/"><b>⌂</b>Головна</a>
<a href="/catalog.html"><b>☷</b>Каталог</a>
<a href="/favorites.html"><b>♡</b>Обране</a>
<a href="/cart.html"><b>🛒</b>Кошик</a>
<a href="/profile.html"><b>♙</b>Профіль</a>
</nav>
</body></html>

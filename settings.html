<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Налаштування</title></head><body><header class="top"><b onclick="history.back()">← Налаштування</b></header><main class="page"><form class="panel" id="f"><label>Ім’я</label><input id="name"><label>Тема</label><select id="theme"><option value="light">Світла тема</option><option value="dark">Темна тема</option></select><button>Зберегти</button><p id="msg"></p></form></main><nav class="bottom"><a href="/"><b>⌂</b>Головна</a><a href="/catalog.html"><b>☷</b>Каталог</a><a href="/favorites.html"><b>♡</b>Обране</a><a href="/cart.html"><b>🛒</b>Кошик</a><a href="/profile.html"><b>♙</b>Профіль</a></nav><script>async function init(){let m=await(await fetch('/api/me')).json();if(!m)return location='/login.html';name.value=m.name||m.username;theme.value=m.theme||'light';if(m.theme==='dark')document.body.classList.add('dark')}f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,theme:theme.value})});msg.textContent=r.ok?'Збережено ✓':'Помилка'};init()</script></body></html>

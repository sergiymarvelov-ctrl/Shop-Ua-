<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>СЮСТР — Профіль</title>
<link rel="stylesheet" href="/style.css">
<style>
.account-page{width:100%;max-width:520px;margin:auto;padding:16px 16px 100px}
.account-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.avatar{width:64px;height:64px;border-radius:50%;background:#eee2c8;display:grid;place-items:center;font-size:30px;margin:0 auto 12px}
.guest{text-align:center;padding-top:25px}.wide{width:100%;margin-top:9px}
.account-head{display:flex;align-items:center;gap:13px}.account-head .avatar{margin:0}
.account-menu a{display:flex;justify-content:space-between;padding:15px 2px;border-bottom:1px solid var(--line);color:var(--ink)!important;text-decoration:none}
</style>
</head>
<body>
<header class="top"><div class="logo"><img src="/logo.jpg"><span>Мій профіль</span></div></header>
<main id="page" class="account-page"></main>
<nav class="bottom">
<a href="/"><b>⌂</b>Головна</a><a href="/catalog.html"><b>☷</b>Каталог</a>
<a href="/favorites.html"><b>♡</b>Обране</a><a href="/cart.html"><b>🛒</b>Кошик</a>
<a href="/profile.html"><b>♙</b>Профіль</a>
</nav>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){
 const m=await(await fetch("/api/me")).json();
 if(!m){
  page.innerHTML=`<section class="account-card guest"><div class="avatar">♙</div><h1>Мій профіль</h1>
  <p class="muted">Увійдіть у свій акаунт або створіть новий.</p>
  <button class="wide" onclick="location='/login.html?mode=login'">Увійти в акаунт</button>
  <button class="outline wide" onclick="location='/login.html?mode=register'">Створити акаунт</button></section>`;
  return;
 }
 page.innerHTML=`<section class="account-card"><div class="account-head"><div class="avatar">♙</div><div><h2 style="margin:0">${esc(m.name||m.username)}</h2><span class="muted">@${esc(m.username)}</span></div></div></section>
 <section class="account-card account-menu">
 <a href="/orders.html"><span>▣ Мої замовлення</span><b>›</b></a>
 <a href="/favorites.html"><span>♡ Обране</span><b>›</b></a>
 <a href="/cart.html"><span>🛒 Кошик</span><b>›</b></a>
 <a href="#rewards"><span>🎁 Нагороди</span><b>›</b></a></section>
 <section id="rewards" class="account-card"><h2>Нагороди</h2><div id="rewardList"></div></section>
 <section class="account-card"><h2>Промокод</h2><input id="promo" placeholder="Введіть промокод"><button class="wide" onclick="usePromo()">Використати</button><p id="promsg"></p></section>
 <button class="outline wide" onclick="logout()">Вийти з акаунта</button>`;
 loadRewards();
}
async function loadRewards(){let r=await fetch("/api/rewards");if(!r.ok)return;let a=await r.json();rewardList.innerHTML=a.map(x=>`<div class="reward"><span>${esc(x.title)}</span><b class="${x.done?"received":""}">${x.done?"Отримано ✓":"Не отримано"}</b></div>`).join("")}
async function usePromo(){let r=await fetch("/api/promo/use",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:promo.value})});let j=await r.json();promsg.textContent=r.ok?"Промокод активовано ✓":j.error;if(r.ok)loadRewards()}
async function logout(){await fetch("/api/logout",{method:"POST"});location="/profile.html"}
init();
</script></body></html>

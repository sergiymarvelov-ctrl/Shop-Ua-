<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Кошик</title></head><body><header class="top"><b onclick="history.back()">← Кошик</b></header><main class="page"><div id="items"></div><section class="panel"><input placeholder="Ввести промокод"><div class="row between"><span>Сума товарів</span><b id="sum"></b></div><hr><div class="row between"><b>Всього</b><h2 id="total"></h2></div><button style="width:100%" onclick="go()">Оформити замовлення</button></section></main><nav class="bottom"><a href="/"><b>⌂</b>Головна</a><a href="/catalog.html"><b>☷</b>Каталог</a><a href="/favorites.html"><b>♡</b>Обране</a><a href="/cart.html"><b>🛒</b>Кошик</a><a href="/profile.html"><b>♙</b>Профіль</a></nav><script>let c=JSON.parse(localStorage.getItem('systrCart')||'[]'),a=[];async function load(){a=await(await fetch('/api/products')).json();draw()}function draw(){let s=0;items.innerHTML=c.map((id,i)=>{let p=a.find(x=>String(x.id)===String(id));if(!p)return'';s+=+p.price;return`<div class="panel row"><img src="${p.image||'/logo.jpg'}" style="width:75px;height:75px;object-fit:cover;border-radius:10px"><div style="flex:1"><b>${p.name}</b><p>${p.price} грн</p></div><button class="outline" onclick="del(${i})">×</button></div>`}).join('')||'<div class="panel">Кошик порожній</div>';sum.textContent=total.textContent=s+' грн'}function del(i){c.splice(i,1);localStorage.setItem('systrCart',JSON.stringify(c));draw()}async function go(){if(!c.length)return alert('Кошик порожній');let m=await(await fetch('/api/me')).json();location=m?'/checkout.html':'/login.html?next=checkout.html'}load()</script></body></html>

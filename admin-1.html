<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СЮСТР — Користувачі</title><link rel="stylesheet" href="/style.css">
<style>*{box-sizing:border-box}.wrap{max-width:650px;margin:auto;padding:16px}.card{background:var(--card,#fffaf0);border:1px solid var(--line,#e4d8c1);border-radius:18px;padding:18px;margin:12px 0}.user{padding:15px 0;border-bottom:1px solid var(--line,#e4d8c1)}.user:last-child{border:0}.badge{height:20px;vertical-align:-4px;border-radius:4px;margin-left:5px}select,button{padding:11px;border-radius:10px;margin-top:8px}button{border:0;background:var(--gold,#b58a32);color:white;font-weight:bold}</style></head>
<body><main class="wrap"><a href="/profile.html">← Профіль</a><h1>Користувачі</h1><div class="card"><p>Тут адмін може поставити користувачу синю галочку або значок ADMIN.</p><div id="list">Завантаження…</div></div></main>
<script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bsrc=b=>b==="check"?"/badge-check.png":b==="admin"?"/badge-admin.jpg":"";
async function load(){let me=await fetch("/api/me").then(r=>r.json());if(!me||!["owner","admin"].includes(me.role)){list.innerHTML="Немає доступу";return}let r=await fetch("/api/admin/users"),a=await r.json();list.innerHTML=a.map(u=>`<div class="user"><b>${esc(u.name||u.username)}</b>${u.badge?`<img class="badge" src="${bsrc(u.badge)}">`:""}<div>@${esc(u.username)} · ${esc(u.role)}</div><select id="b${u.id}"><option value="" ${!u.badge?"selected":""}>Без значка</option><option value="check" ${u.badge==="check"?"selected":""}>Синя галочка</option><option value="admin" ${u.badge==="admin"?"selected":""}>ADMIN</option></select> <button onclick="setBadge('${u.id}')">Зберегти</button></div>`).join("")}
async function setBadge(id){let r=await fetch("/api/admin/users/"+id+"/badge",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({badge:document.getElementById("b"+id).value})});let j=await r.json().catch(()=>({}));if(!r.ok){alert(j.error||"Помилка");return}load()}load();
</script></body></html>

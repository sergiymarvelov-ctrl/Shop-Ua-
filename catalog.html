<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Каталог</title></head><body><header class="top"><b onclick="history.back()">← Каталог</b><span>⌕</span></header><main class="page"><input id="q" class="search" placeholder="Пошук товарів..." oninput="draw()"><div class="tabs"><button onclick="sort='all';draw()">Популярні</button><button class="outline" onclick="sort='price';draw()">За ціною</button></div><div id="products" class="grid"></div></main><nav class="bottom"><a href="/"><b>⌂</b>Головна</a><a href="/catalog.html"><b>☷</b>Каталог</a><a href="/favorites.html"><b>♡</b>Обране</a><a href="/cart.html"><b>🛒</b>Кошик</a><a href="/profile.html"><b>♙</b>Профіль</a></nav><script>let a=[],sort='all';async function load(){a=await(await fetch('/api/products')).json();draw()}function draw(){let x=a.filter(p=>p.name.toLowerCase().includes(q.value.toLowerCase()));if(sort==='price')x.sort((a,b)=>a.price-b.price);products.innerHTML=x.map(p=>`<article class="card"><button class="heart" onclick="fav('${p.id}')">♡</button><img onclick="location='/product.html?id=${p.id}'" src="${p.image||'/logo.jpg'}"><h3>${p.name}</h3><span class="muted">Ручна робота</span><br><b class="price">${p.price} грн</b><button class="add" onclick="add('${p.id}')">+</button></article>`).join('')}function add(id){let c=JSON.parse(localStorage.getItem('systrCart')||'[]');c.push(id);localStorage.setItem('systrCart',JSON.stringify(c))}function fav(id){let f=JSON.parse(localStorage.getItem('systrFav')||'[]');f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.setItem('systrFav',JSON.stringify(f))}load()</script></body></html>

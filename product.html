<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Товар</title></head><body><header class="top"><button class="icon" onclick="history.back()">←</button><span>♡</span></header><main class="page product-view" id="view"></main><nav class="bottom"><a href="/"><b>⌂</b>Головна</a><a href="/catalog.html"><b>☷</b>Каталог</a><a href="/favorites.html"><b>♡</b>Обране</a><a href="/cart.html"><b>🛒</b>Кошик</a><a href="/profile.html"><b>♙</b>Профіль</a></nav><script>let p,id=new URLSearchParams(location.search).get('id');async function load(){let a=await(await fetch('/api/products')).json();p=a.find(x=>String(x.id)===String(id));if(!p)return view.innerHTML='<h2>Товар не знайдено</h2>';view.innerHTML=`<img src="${p.image||'/logo.jpg'}"><h1>${p.name}</h1><p>⭐ 4.9 <span class="muted">відгуки покупців</span></p><h2>${p.price} грн</h2><button style="width:100%" onclick="add()">Додати в кошик</button><button class="outline" style="width:100%;margin-top:8px" onclick="add();location='/cart.html'">Купити зараз</button><section class="panel"><b>🌿 Натуральні інгредієнти · ♡ Ручна робота · 🎁 Для подарунка</b><h3>Опис</h3><p>${p.desc||'Натуральне мило ручної роботи.'}</p></section>`}function add(){let c=JSON.parse(localStorage.getItem('systrCart')||'[]');c.push(String(p.id));localStorage.setItem('systrCart',JSON.stringify(c))}load()</script></body></html>
